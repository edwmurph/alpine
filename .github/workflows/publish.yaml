name: Create and publish a Docker image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate
        run: docker build --pull --platform linux/${{ matrix.arch }} -t candidate:test .
      - name: Test tools and shell
        run: tests/smoke.sh candidate:test linux/${{ matrix.arch }}
      - name: Scan all vulnerability severities with current advisory data
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/reports" aquasec/trivy:0.76.1 image --scanners vuln --exit-code 1 --format json --output /reports/trivy-${{ matrix.arch }}.json candidate:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json

  build-and-push-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify published artifacts
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            docker pull --platform linux/$arch "$IMAGE"
            tests/smoke.sh "$IMAGE" linux/$arch
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/reports" aquasec/trivy:0.76.1 image --scanners vuln --exit-code 1 --format json --output /reports/published-$arch.json "$IMAGE"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-security
          path: published-*.json
